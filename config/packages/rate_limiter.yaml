framework:
    rate_limiter:
        # Caps two-factor code verification attempts, so a 6-digit code cannot be brute-forced
        # while it is valid. The password step is covered by the firewall's login_throttling.
        two_factor_check:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        # Resending is limited both by a minimum interval between codes and by a total per window.
        two_factor_resend_interval:
            policy: fixed_window
            limit: 1
            interval: '60 seconds'
        two_factor_resend_window:
            policy: fixed_window
            limit: 3
            interval: '10 minutes'
