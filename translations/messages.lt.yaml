about_page:
    title: Apie sistemą
    breadcrumb:
        current: Apie sistemą
    heading: Apie sistemą
    description: 'Sužinokite daugiau apie skundų nagrinėjimo sistemą ir jos veikimo principus.'
    who_we_are:
        heading: Kas mes esame?
        description: 'Tai oficiali skundų valdymo platforma, sukurta siekiant supaprastinti piliečių ir valstybės institucijų sąveiką. Mūsų sistema leidžia saugiai pateikti skundus, stebėti jų nagrinėjimo eigą realiu laiku bei gauti oficialius atsakymus elektroniniu būdu. Mes tikime, kad skaidrus skundų nagrinėjimas yra viena iš svarbiausių sąlygų gerinant viešąsias paslaugas.'
    how_it_works:
        heading: Kaip veikia sistema?
        step1: Pasirinkite naujo skundo teikimą.
        step2: Pasirinkite skundo tipą, nurodykite asmeninę informaciją.
        step3: Aprašykite situaciją ir pridėkite susijusius dokumentus.
        step4: Peržiūrėkite užpildytą skundą ir pateikite.
        step5: Sekite skundo nagrinėjimo eigą.
        step6: Esant reikalui, papildykite skundą trūkstama informacija.
        step7_prefix: 'Gaukite išvadas per '
        step7_duration: 60 darbo dienų.
    goals:
        heading: Mūsų tikslai
        transparency:
            title: Skaidrumas
            description: 'Užtikriname, kad kiekvienas skundas būtų užregistruotas ir nagrinėjamas numatyto teisinio proceso keliu.'
        efficiency:
            title: Efektyvumas
            description: 'Trumpiname skundų perdavimo ir nagrinėjimo procesus naudodami skaitmenizuotus įrankius.'
        accessibility:
            title: Prieinamumas
            description: 'Sudarome sąlygas visiems Lietuvos piliečiams galimybę pateikti skundus nuotoliniu būdu.'
    legal_basis:
        heading: Teisinė bazė
        description: 'Sistemos veikla yra grindžiama Lietuvos Respublikos Viešojo administravimo įstatymu, Pacientų teisių ir žalos sveikatai atlyginimo įstatymu bei kitais teisės aktais, reglamentuojančiais asmenų prašymų ir skundų nagrinėjimą viešojo administravimo subjektuose. Visi jūsų duomenys tvarkomi laikantis Bendrojo duomenų apsaugos reglamento (BDAR).'
    cta:
        heading: Turite skundą?
        description: 'Pradėkite pildyti formą dabar – tai kelių žingsnių nesudėtingas procesas.'
        button: Pateikti skundą

